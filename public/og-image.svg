<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f11"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(262,83%,58%)"/>
      <stop offset="100%" stop-color="hsl(270,80%,65%)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Logo box -->
  <rect x="80" y="220" width="80" height="80" rx="18" fill="url(#brand)"/>
  <!-- Smartphone icon in logo -->
  <rect x="100" y="232" width="40" height="56" rx="6" stroke="white" stroke-width="3.5" fill="none"/>
  <line x1="120" y1="275" x2="120" y2="275" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="238" x2="130" y2="238" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- AppicraFy text -->
  <text x="180" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="white">AppicraFy</text>
  <!-- Tagline -->
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255,255,255,0.6)">AI Mobile App Generator — Build apps instantly</text>
  <!-- Subtle glow -->
  <ellipse cx="600" cy="630" rx="500" ry="200" fill="hsl(262,83%,58%)" opacity="0.08"/>
</svg>
